name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the deterministic development path
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov
      - name: Lint and compile
        run: |
          python -m ruff check scripts/validate_package.py
          python -m compileall -q litdatamatcher scripts/validate_package.py
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: python -m pytest --cov=litdatamatcher --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -m pytest
      - name: Exercise the offline CLI demo
        run: |
          python -m litdatamatcher.cli demo --out "$RUNNER_TEMP/litdatamatcher-demo"
          python -m litdatamatcher.cli report --run-dir "$RUNNER_TEMP/litdatamatcher-demo"
          test -s "$RUNNER_TEMP/litdatamatcher-demo/matches.jsonl"
          test -s "$RUNNER_TEMP/litdatamatcher-demo/publication_report.md"
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  codecov-upload:
    name: Upload coverage to Codecov
    needs: test
    if: vars.CODECOV_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml
          path: coverage
      - name: Upload with OIDC
        uses: codecov/codecov-action@046562be8d17331600874a09d2c2062c27752c20 # v7.1.0
        with:
          files: coverage/coverage.xml
          use_oidc: true
          fail_ci_if_error: true
