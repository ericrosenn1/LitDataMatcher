name: Package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    name: Build and install distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distribution contents and metadata
        run: |
          python scripts/validate_package.py --dist dist
          python -m twine check --strict dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/python -m pip install dist/*.whl
          .package-venv/bin/python -c "import litdatamatcher; print(litdatamatcher.__version__)"
          .package-venv/bin/python -m litdatamatcher.cli demo --out "$RUNNER_TEMP/package-demo"
          test -s "$RUNNER_TEMP/package-demo/matches.jsonl"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
