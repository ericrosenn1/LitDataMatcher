name: Publish package to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Validated final release tag to publish (for example, v0.4.0)"
        required: true
        type: string
      confirm_feature_complete:
        description: "Confirm that v0.4 is FEATURE_COMPLETE and release gates passed"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: inputs.confirm_feature_complete
    name: Build final release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python scripts/validate_package.py --dist dist
          python -m twine check --strict dist/*
      - name: Upload distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    name: Publish final distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litdatamatcher/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74 # v1.9.0
