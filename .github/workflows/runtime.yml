name: Local model contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU runtime and optional structured decoder
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,runtime,structured]"
      - name: Validate local generation, training, caching, and source guards
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          python -m pytest
          tests/test_structured_decoding.py
          tests/test_runtime_qualification_receipts.py
          tests/test_retrieval_training.py
          tests/test_retrieval_cache.py
          tests/test_retrieval_evaluation.py
      # Tiny randomly initialized models validate software contracts only.
      # Real pretrained-model quality is reported in the research evidence.
